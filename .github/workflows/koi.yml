name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/koi.yml
      - scripts/crop_koi.py

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi
      # Crop the empty 512x512 canvas around the koi so it shows up large.
      - name: Crop the koi
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/crop_koi.py koi/koi.gif 2 12
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git pull --quiet --rebase || true
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
