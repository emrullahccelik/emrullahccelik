name: Bonsai

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bonsai.yml
      - scripts/recolor_bonsai.py

permissions:
  contents: write

concurrency: bonsai

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac
        with:
          commit: "false"
      # Purple / blue leaves instead of the default green.
      - run: python3 scripts/recolor_bonsai.py output/bonsai.gif output/bonsai-growth.gif
      - name: Commit the bonsai if it changed
        run: |
          git add output
          if git diff --cached --quiet; then
            echo "The bonsai is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: tend the bonsai 🌳"
          git pull --quiet --rebase
          git push --quiet
